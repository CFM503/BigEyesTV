name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Keystore and Signing Config
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 || '' }}" | base64 --decode > keystore/bigeyes-release.jks
          cat <<EOF > key.properties
          storeFile=../keystore/bigeyes-release.jks
          storePassword=bigeyes2026tv
          keyAlias=bigeyes-key
          keyPassword=bigeyes2026tv
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --info > gradle-build.log 2>&1 || (cat gradle-build.log && exit 1)

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.ref_name }}
          path: gradle-build.log
          if-no-files-found: warn

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/BigEyesTV-*.apk
          name: BigEyes-TV ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
